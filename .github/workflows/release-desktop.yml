name: Release Desktop

# v* etiketli (örn. v2.0.2) bir tag push edildiğinde tetiklenir.
# Üç işletim sistemi için paketler ve GitHub Releases'a yükler.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        # markdown-pdf is an optionalDependency; if its phantomjs-prebuilt binary
        # fails to download on macOS/Windows, npm logs a warning and continues.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build app bundles
        run: npm run desktop:build

      - name: Package & publish (electron-builder)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── macOS code signing + notarization ──────────────────────────────
          # Yalnızca macOS runner'ında ve secret'lar tanımlıysa devreye girer.
          # CSC_LINK: base64'lenmiş Developer ID Application .p12 sertifikası
          # CSC_KEY_PASSWORD: .p12 parolası
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID: notarytool
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # macOS'ta imzalama sertifikası (CSC_LINK) tanımlı DEĞİLSE, imzasız
          # build'e düş ve notarize'ı kapat — böylece secret'lar girilmeden de
          # mac job'u patlamaz. Secret'lar girilince otomatik imzalı + notarize.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then
            echo "::warning::No Developer ID cert (CSC_LINK boş) — macOS build imzasız üretilecek, auto-update mac'te çalışmaz."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --publish always -c.mac.notarize=false
          else
            npx electron-builder --publish always
          fi

      - name: Upload artifacts (build kaydı)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-wrangler-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.exe
          retention-days: 7
          if-no-files-found: ignore
