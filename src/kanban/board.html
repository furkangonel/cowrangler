<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kanban — Co-Wrangler</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #0d1117;
                --bg2: #161b22;
                --bg3: #21262d;
                --border: #30363d;
                --text: #e6edf3;
                --text2: #8b949e;
                --accent: #ff4c00;
                --green: #3fb950;
                --yellow: #d29922;
                --red: #f85149;
                --purple: #bc8cff;
                --pending: #58a6ff;
                --running: #d29922;
                --done: #3fb950;
                --blocked: #f85149;
                --urgent: #f85149;
                --high: #d29922;
                --normal: #8b949e;
                --low: #484f58;
                --radius: 6px;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                font-size: 14px;
                min-height: 100vh;
            }

            /* ── Header ── */
            header {
                background: var(--bg2);
                border-bottom: 1px solid var(--border);
                padding: 10px 20px;
                display: flex;
                align-items: center;
                gap: 16px;
                position: sticky;
                top: 0;
                z-index: 100;
            }

            /* Brand block: icon + stacked CoWrangler / KANBAN */
            .brand-block {
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
            }
            .brand-icon {
                width: 38px;
                height: 38px;
                border-radius: 8px;
                object-fit: cover;
                flex-shrink: 0;
            }
            .brand-text {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                line-height: 1;
            }
            .brand-name {
                font-size: 15px;
                font-weight: 700;
                color: var(--accent);
                letter-spacing: -0.01em;
                white-space: nowrap;
            }
            .brand-sub {
                font-size: 8.5px;
                font-weight: 700;
                letter-spacing: 0.22em;
                color: var(--text2);
                text-transform: uppercase;
                margin-top: 3px;
                width: 100%;
                text-align: center;
            }

            /* ── Offline banner ── */
            .offline-banner {
                display: none;
                background: var(--red)18;
                border-bottom: 1px solid var(--red)44;
                padding: 7px 20px;
                font-size: 12px;
                color: var(--red);
                gap: 8px;
                align-items: center;
            }
            .offline-banner.visible { display: flex; }

            .stats-bar {
                display: flex;
                gap: 12px;
                margin-left: auto;
                align-items: center;
            }
            .stat {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 12px;
                color: var(--text2);
            }
            .stat .num {
                font-weight: 600;
            }
            .stat.pending .num {
                color: var(--pending);
            }
            .stat.running .num {
                color: var(--running);
            }
            .stat.done .num {
                color: var(--done);
            }
            .stat.blocked .num {
                color: var(--blocked);
            }

            .live-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--green);
                box-shadow: 0 0 6px var(--green);
                animation: pulse 2s infinite;
            }
            .live-dot.offline {
                background: var(--red);
                box-shadow: 0 0 6px var(--red);
                animation: none;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.4;
                }
            }

            /* ── Toolbar ── */
            .toolbar {
                padding: 10px 20px;
                display: flex;
                gap: 8px;
                align-items: center;
                border-bottom: 1px solid var(--border);
                background: var(--bg);
            }
            .toolbar button,
            .toolbar input,
            .toolbar select {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                color: var(--text);
                padding: 5px 10px;
                font-size: 13px;
                cursor: pointer;
            }
            .toolbar button:hover {
                background: var(--bg3);
                border-color: var(--accent);
            }
            .toolbar input {
                min-width: 200px;
            }
            .toolbar input::placeholder {
                color: var(--text2);
            }
            .toolbar .sep {
                margin-left: auto;
            }

            /* ── Board ── */
            .board {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
                padding: 16px 20px;
                min-height: calc(100vh - 120px);
                align-items: start;
            }
            @media (max-width: 900px) {
                .board {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 500px) {
                .board {
                    grid-template-columns: 1fr;
                }
            }

            /* ── Column ── */
            .col {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
            }
            .col-header {
                padding: 10px 12px;
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                display: flex;
                align-items: center;
                gap: 6px;
                border-bottom: 1px solid var(--border);
            }
            .col-header .col-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
            }
            .col-header .col-count {
                margin-left: auto;
                background: var(--bg3);
                border-radius: 10px;
                padding: 1px 7px;
                font-size: 11px;
                color: var(--text2);
            }

            .col[data-status="pending"] .col-dot {
                background: var(--pending);
            }
            .col[data-status="running"] .col-dot {
                background: var(--running);
            }
            .col[data-status="done"] .col-dot {
                background: var(--done);
            }
            .col[data-status="blocked"] .col-dot {
                background: var(--blocked);
            }

            .col-body {
                padding: 8px;
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-height: 80px;
            }
            .col-empty {
                color: var(--text2);
                font-size: 12px;
                text-align: center;
                padding: 20px;
            }

            /* ── Task Card ── */
            .card {
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 10px 12px;
                cursor: pointer;
                transition:
                    border-color 0.15s,
                    box-shadow 0.15s;
                position: relative;
            }
            .card:hover {
                border-color: var(--accent);
                box-shadow: 0 0 0 1px var(--accent) 20;
            }
            .card.new-flash {
                animation: flash 0.6s ease-out;
            }
            @keyframes flash {
                0% {
                    background: var(--accent) 22;
                    border-color: var(--accent);
                }
                100% {
                    background: var(--bg3);
                    border-color: var(--border);
                }
            }

            .card-title {
                font-size: 13px;
                font-weight: 500;
                margin-bottom: 6px;
                line-height: 1.4;
                color: var(--text);
            }
            .card-meta {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-wrap: wrap;
            }
            .badge {
                font-size: 11px;
                padding: 1px 6px;
                border-radius: 10px;
                font-weight: 500;
            }
            .badge.urgent {
                background: var(--urgent) 22;
                color: var(--urgent);
                border: 1px solid var(--urgent) 44;
            }
            .badge.high {
                background: var(--high) 22;
                color: var(--high);
                border: 1px solid var(--high) 44;
            }
            .badge.normal {
                display: none;
            }
            .badge.low {
                background: var(--bg);
                color: var(--text2);
                border: 1px solid var(--border);
            }

            .card-id {
                font-size: 10px;
                color: var(--text2);
                font-family: monospace;
            }
            .card-assign {
                font-size: 11px;
                color: var(--purple);
            }
            .card-time {
                font-size: 11px;
                color: var(--text2);
                margin-left: auto;
            }

            .tags {
                display: flex;
                gap: 3px;
                flex-wrap: wrap;
                margin-top: 4px;
            }
            .tag {
                font-size: 10px;
                padding: 1px 5px;
                background: var(--accent) 11;
                color: var(--accent);
                border-radius: 3px;
                border: 1px solid var(--accent) 22;
            }

            /* ── Running spinner ── */
            .running-indicator {
                display: inline-block;
                width: 8px;
                height: 8px;
                border: 1.5px solid var(--running) 44;
                border-top-color: var(--running);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-right: 4px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* ── Modal ── */
            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                z-index: 1000;
                align-items: center;
                justify-content: center;
            }
            .modal-overlay.open {
                display: flex;
            }
            .modal {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 10px;
                width: min(600px, 95vw);
                max-height: 85vh;
                overflow-y: auto;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            }
            .modal-header {
                padding: 14px 16px;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: flex-start;
                gap: 10px;
            }
            .modal-header h2 {
                font-size: 15px;
                font-weight: 600;
                flex: 1;
                line-height: 1.4;
            }
            .modal-close {
                background: none;
                border: none;
                color: var(--text2);
                cursor: pointer;
                font-size: 18px;
                padding: 0 4px;
                line-height: 1;
            }
            .modal-close:hover {
                color: var(--text);
            }
            .modal-body {
                padding: 14px 16px;
            }

            .detail-row {
                margin-bottom: 10px;
                font-size: 13px;
            }
            .detail-row .label {
                color: var(--text2);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                margin-bottom: 3px;
            }
            .detail-row .value {
                color: var(--text);
            }
            .detail-row pre {
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 8px 10px;
                font-size: 12px;
                font-family: monospace;
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 200px;
                overflow-y: auto;
                color: var(--text);
            }

            .comments {
                margin-top: 12px;
            }
            .comments .label {
                color: var(--text2);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                margin-bottom: 8px;
            }
            .comment {
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 4px;
                padding: 8px 10px;
                margin-bottom: 6px;
                font-size: 12px;
            }
            .comment .comment-author {
                color: var(--accent);
                font-weight: 600;
                margin-right: 6px;
            }
            .comment .comment-time {
                color: var(--text2);
                font-size: 10px;
            }
            .comment .comment-body {
                margin-top: 4px;
                color: var(--text);
                white-space: pre-wrap;
            }

            /* ── New Task Form ── */
            .new-task-form {
                display: none;
                padding: 12px 20px;
                border-bottom: 1px solid var(--border);
                background: var(--bg2);
                gap: 8px;
                align-items: flex-end;
                flex-wrap: wrap;
            }
            .new-task-form.open {
                display: flex;
            }
            .new-task-form label {
                font-size: 12px;
                color: var(--text2);
                display: block;
                margin-bottom: 3px;
            }
            .new-task-form input,
            .new-task-form select,
            .new-task-form textarea {
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                color: var(--text);
                padding: 6px 10px;
                font-size: 13px;
                font-family: inherit;
            }
            .new-task-form .field-title {
                flex: 1;
                min-width: 220px;
            }
            .new-task-form .field-title input {
                width: 100%;
            }
            .new-task-form input:focus,
            .new-task-form select:focus,
            .new-task-form textarea:focus {
                outline: none;
                border-color: var(--accent);
            }
            .btn-primary {
                background: var(--accent);
                color: #0d1117;
                border: none;
                border-radius: var(--radius);
                padding: 6px 14px;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
            }
            .btn-primary:hover {
                opacity: 0.85;
            }
            .btn-secondary {
                background: var(--bg3);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 12px;
                font-size: 13px;
                cursor: pointer;
            }
            .btn-secondary:hover {
                border-color: var(--text2);
            }

            /* ── Edit form (inside modal) ── */
            .edit-form { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
            .edit-form .ef-row { margin-bottom: 10px; }
            .edit-form .ef-row label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 4px; }
            .edit-form input,
            .edit-form select,
            .edit-form textarea {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                color: var(--text);
                padding: 6px 10px;
                font-size: 13px;
                font-family: inherit;
                box-sizing: border-box;
            }
            .edit-form textarea { min-height: 70px; resize: vertical; }
            .edit-form input:focus,
            .edit-form select:focus,
            .edit-form textarea:focus { outline: none; border-color: var(--accent); }
            .edit-actions { display: flex; gap: 6px; margin-top: 12px; }

            /* ── Modal header edit button ── */
            .modal-edit-btn {
                background: none; border: 1px solid var(--border);
                border-radius: var(--radius); color: var(--text2);
                cursor: pointer; font-size: 12px; padding: 3px 8px; margin-left: auto;
            }
            .modal-edit-btn:hover { border-color: var(--accent); color: var(--accent); }

            /* ── Comment input ── */
            .comment-input-area { margin-top: 12px; }
            .comment-input-area textarea {
                width: 100%; background: var(--bg); border: 1px solid var(--border);
                border-radius: var(--radius); color: var(--text);
                padding: 6px 10px; font-size: 12px; font-family: inherit;
                min-height: 54px; resize: vertical; box-sizing: border-box;
            }
            .comment-input-area textarea:focus { outline: none; border-color: var(--accent); }
            .comment-input-area .comment-submit {
                margin-top: 5px; background: var(--bg3); border: 1px solid var(--border);
                border-radius: var(--radius); color: var(--text2); cursor: pointer;
                font-size: 12px; padding: 4px 10px;
            }
            .comment-input-area .comment-submit:hover { color: var(--text); border-color: var(--text2); }

            /* ── Toast ── */
            .toast-container {
                position: fixed;
                bottom: 20px;
                right: 20px;
                z-index: 2000;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .toast {
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 10px 14px;
                font-size: 13px;
                color: var(--text);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
                animation: slide-in 0.2s ease-out;
                max-width: 300px;
            }
            .toast.success {
                border-left: 3px solid var(--green);
            }
            .toast.error {
                border-left: 3px solid var(--red);
            }
            @keyframes slide-in {
                from {
                    transform: translateX(20px);
                    opacity: 0;
                }
                to {
                    transform: none;
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="brand-block">
                <img src="/assets/kanban_ui_icon.png" class="brand-icon" alt="CoWrangler" onerror="this.style.display='none'">
                <div class="brand-text">
                    <span class="brand-name">CoWrangler</span>
                    <span class="brand-sub">Kanban</span>
                </div>
            </div>
            <div class="stats-bar">
                <span class="stat pending"><span class="num" id="stat-pending">0</span> pending</span>
                <span class="stat running"><span class="num" id="stat-running">0</span> running</span>
                <span class="stat done"><span class="num" id="stat-done">0</span> done</span>
                <span class="stat blocked"><span class="num" id="stat-blocked">0</span> blocked</span>
                <div class="live-dot offline" id="live-dot" title="SSE connection"></div>
            </div>
        </header>
        <div class="offline-banner" id="offline-banner">
            ⚠ Server offline — <span id="offline-msg">make sure <code>cowrangler kanban board</code> is running</span>
        </div>

        <div class="toolbar">
            <button id="btn-new">＋ New Task</button>
            <input
                id="filter-input"
                type="text"
                placeholder="Filter by title or tag…"
            />
            <select id="filter-priority">
                <option value="">All priorities</option>
                <option value="urgent">Urgent</option>
                <option value="high">High</option>
                <option value="normal">Normal</option>
                <option value="low">Low</option>
            </select>
            <span class="sep"></span>
            <button id="btn-refresh" title="Refresh board">↻</button>
        </div>

        <div class="new-task-form" id="new-task-form">
            <div class="field-title">
                <label>Title *</label>
                <input id="nt-title" type="text" placeholder="Task title…" />
            </div>
            <div>
                <label>Priority</label>
                <select id="nt-priority">
                    <option value="normal">Normal</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                    <option value="low">Low</option>
                </select>
            </div>
            <div>
                <label>Tags (comma separated)</label>
                <input
                    id="nt-tags"
                    type="text"
                    placeholder="api, backend…"
                    style="width: 160px"
                />
            </div>
            <div>
                <label>Assign to</label>
                <input
                    id="nt-assign"
                    type="text"
                    placeholder="agent name…"
                    style="width: 120px"
                />
            </div>
            <div style="display: flex; gap: 6px; align-items: flex-end">
                <button class="btn-primary" id="nt-submit">Create</button>
                <button class="btn-secondary" id="nt-cancel">Cancel</button>
            </div>
        </div>

        <div class="board" id="board">
            <div class="col" data-status="pending">
                <div class="col-header">
                    <div class="col-dot"></div>
                    Pending <span class="col-count" id="cnt-pending">0</span>
                </div>
                <div class="col-body" id="col-pending"></div>
            </div>
            <div class="col" data-status="running">
                <div class="col-header">
                    <div class="col-dot"></div>
                    Running <span class="col-count" id="cnt-running">0</span>
                </div>
                <div class="col-body" id="col-running"></div>
            </div>
            <div class="col" data-status="done">
                <div class="col-header">
                    <div class="col-dot"></div>
                    Done <span class="col-count" id="cnt-done">0</span>
                </div>
                <div class="col-body" id="col-done"></div>
            </div>
            <div class="col" data-status="blocked">
                <div class="col-header">
                    <div class="col-dot"></div>
                    Blocked <span class="col-count" id="cnt-blocked">0</span>
                </div>
                <div class="col-body" id="col-blocked"></div>
            </div>
        </div>

        <!-- Task Detail Modal -->
        <div class="modal-overlay" id="modal-overlay">
            <div class="modal" id="modal">
                <div class="modal-header">
                    <h2 id="modal-title">Task</h2>
                    <button class="modal-edit-btn" id="modal-edit-btn" title="Edit task">✎ Edit</button>
                    <button class="modal-close" id="modal-close">✕</button>
                </div>
                <div class="modal-body" id="modal-body"></div>
            </div>
        </div>

        <!-- Toast container -->
        <div class="toast-container" id="toasts"></div>

        <script>
            // ─── State ───────────────────────────────────────────────────────────────────
            let allTasks = [];
            let filterText = "";
            let filterPriority = "";
            let sse = null;
            let currentEditTaskId = null;
            let serverOnline = false;

            // ─── Time helper ─────────────────────────────────────────────────────────────
            function timeAgo(ts) {
                const diff = Date.now() - ts;
                const s = Math.floor(diff / 1000);
                if (s < 60) return `${s}s ago`;
                const m = Math.floor(s / 60);
                if (m < 60) return `${m}m ago`;
                const h = Math.floor(m / 60);
                if (h < 24) return `${h}h ago`;
                return `${Math.floor(h / 24)}d ago`;
            }

            // ─── Toast ───────────────────────────────────────────────────────────────────
            function toast(msg, type = "success") {
                const el = document.createElement("div");
                el.className = `toast ${type}`;
                el.textContent = msg;
                document.getElementById("toasts").appendChild(el);
                setTimeout(() => el.remove(), 3500);
            }

            // ─── Offline banner helpers ───────────────────────────────────────────────────
            function setOffline(msg) {
                serverOnline = false;
                const banner = document.getElementById("offline-banner");
                const msgEl = document.getElementById("offline-msg");
                if (msg) msgEl.textContent = msg;
                banner.classList.add("visible");
                document.getElementById("live-dot").classList.add("offline");
            }
            function setOnline() {
                serverOnline = true;
                document.getElementById("offline-banner").classList.remove("visible");
            }

            // ─── Fetch tasks ─────────────────────────────────────────────────────────────
            async function loadTasks(silent = false) {
                try {
                    const r = await fetch("/api/tasks");
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    allTasks = await r.json();
                    setOnline();
                    render();
                    updateStats();
                } catch (e) {
                    setOffline("make sure cowrangler kanban board is running");
                    if (!silent) {
                        // Only show toast on non-silent calls (user-triggered refresh)
                        toast("Cannot reach server", "error");
                    }
                }
            }

            async function loadStats() {
                try {
                    const r = await fetch("/api/stats");
                    const s = await r.json();
                    document.getElementById("stat-pending").textContent = s.pending;
                    document.getElementById("stat-running").textContent = s.running;
                    document.getElementById("stat-done").textContent = s.done;
                    document.getElementById("stat-blocked").textContent = s.blocked;
                } catch {}
            }

            function updateStats() {
                const counts = { pending: 0, running: 0, done: 0, blocked: 0 };
                for (const t of allTasks) {
                    const k = t.status === "claimed" ? "running" : t.status;
                    if (k in counts) counts[k]++;
                }
                document.getElementById("stat-pending").textContent =
                    counts.pending;
                document.getElementById("stat-running").textContent =
                    counts.running;
                document.getElementById("stat-done").textContent = counts.done;
                document.getElementById("stat-blocked").textContent =
                    counts.blocked;
            }

            // ─── Render ──────────────────────────────────────────────────────────────────
            function makeCard(task, flash = false) {
                const card = document.createElement("div");
                card.className = "card" + (flash ? " new-flash" : "");
                card.dataset.id = task.id;

                const isRunning =
                    task.status === "running" || task.status === "claimed";

                card.innerHTML = `
    <div class="card-title">
      ${isRunning ? '<span class="running-indicator"></span>' : ""}${escHtml(task.title)}
    </div>
    <div class="card-meta">
      <span class="badge ${task.priority}">${task.priority !== "normal" ? task.priority : ""}</span>
      <span class="card-id">${task.id.slice(0, 8)}</span>
      ${task.assigned_to ? `<span class="card-assign">@${escHtml(task.assigned_to)}</span>` : ""}
      <span class="card-time">${timeAgo(task.updated_at)}</span>
    </div>
    ${task.tags && task.tags.length ? `<div class="tags">${task.tags.map((t) => `<span class="tag">${escHtml(t)}</span>`).join("")}</div>` : ""}
  `;

                card.addEventListener("click", () => openModal(task.id));
                return card;
            }

            function escHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function matchesFilter(task) {
                if (filterPriority && task.priority !== filterPriority)
                    return false;
                if (filterText) {
                    const q = filterText.toLowerCase();
                    const inTitle = task.title.toLowerCase().includes(q);
                    const inTags = (task.tags || []).some((t) =>
                        t.toLowerCase().includes(q),
                    );
                    if (!inTitle && !inTags) return false;
                }
                return true;
            }

            function colKey(status) {
                return status === "claimed" ? "running" : status;
            }

            function render() {
                const cols = {
                    pending: [],
                    running: [],
                    done: [],
                    blocked: [],
                };
                for (const t of allTasks) {
                    if (!matchesFilter(t)) continue;
                    const k = colKey(t.status);
                    if (k in cols) cols[k].push(t);
                }

                for (const [status, tasks] of Object.entries(cols)) {
                    const el = document.getElementById(`col-${status}`);
                    const cnt = document.getElementById(`cnt-${status}`);
                    cnt.textContent = tasks.length;
                    el.innerHTML = "";
                    if (tasks.length === 0) {
                        el.innerHTML = `<div class="col-empty">No ${status} tasks</div>`;
                    } else {
                        for (const t of tasks) el.appendChild(makeCard(t));
                    }
                }
            }

            // ─── Modal ───────────────────────────────────────────────────────────────────
            async function openModal(taskId, startInEdit = false) {
                try {
                    const r = await fetch(`/api/tasks/${taskId}`);
                    const task = await r.json();
                    currentEditTaskId = task.id;

                    document.getElementById("modal-title").textContent = task.title;

                    const statusColor = {
                        pending: "var(--pending)", running: "var(--running)",
                        done: "var(--done)", blocked: "var(--blocked)", claimed: "var(--running)",
                    };

                    // ── View mode HTML ──────────────────────────────────────────
                    let viewHtml = `
                      <div class="detail-row">
                        <div class="label">Status</div>
                        <div class="value" style="color:${statusColor[task.status]||"inherit"}">${task.status}</div>
                      </div>
                      <div class="detail-row">
                        <div class="label">Priority</div>
                        <div class="value">${task.priority}</div>
                      </div>
                      <div class="detail-row">
                        <div class="label">ID</div>
                        <div class="value" style="font-family:monospace;font-size:12px">${task.id}</div>
                      </div>`;

                    if (task.assigned_to) viewHtml += `<div class="detail-row"><div class="label">Assigned to</div><div class="value">${escHtml(task.assigned_to)}</div></div>`;
                    if (task.description) viewHtml += `<div class="detail-row"><div class="label">Description</div><pre>${escHtml(task.description)}</pre></div>`;
                    if (task.output)      viewHtml += `<div class="detail-row"><div class="label">Output</div><pre>${escHtml(task.output.slice(0,2000))}${task.output.length>2000?"\n…(truncated)":""}</pre></div>`;
                    if (task.error)       viewHtml += `<div class="detail-row"><div class="label" style="color:var(--red)">Error</div><pre style="color:var(--red)">${escHtml(task.error)}</pre></div>`;
                    if (task.tags && task.tags.length) viewHtml += `<div class="detail-row"><div class="label">Tags</div><div class="tags">${task.tags.map(t=>`<span class="tag">${escHtml(t)}</span>`).join("")}</div></div>`;
                    if (task.blockers && task.blockers.length) viewHtml += `<div class="detail-row"><div class="label">Blocked by</div><div class="value">${task.blockers.map(b=>`<span style="font-family:monospace;font-size:12px">${b.id.slice(0,8)}</span> ${escHtml(b.title)}`).join("<br>")}</div></div>`;
                    viewHtml += `<div class="detail-row"><div class="label">Created</div><div class="value">${new Date(task.created_at).toLocaleString()}</div></div>`;
                    if (task.completed_at) viewHtml += `<div class="detail-row"><div class="label">Completed</div><div class="value">${new Date(task.completed_at).toLocaleString()}</div></div>`;

                    // Quick actions
                    if (task.status !== "done") {
                        viewHtml += `<div class="detail-row" style="margin-top:14px">
                          <div class="label">Quick Actions</div>
                          <div style="display:flex;gap:6px;margin-top:4px">
                            <button class="btn-secondary" onclick="quickAction('${task.id}','done')">✓ Mark Done</button>
                            ${task.status==="blocked" ? `<button class="btn-secondary" onclick="quickAction('${task.id}','pending')">↑ Unblock</button>` : ""}
                            ${task.status==="pending"||task.status==="running" ? `<button class="btn-secondary" onclick="quickAction('${task.id}','blocked')">✗ Block</button>` : ""}
                          </div>
                        </div>`;
                    }

                    // Comments
                    viewHtml += `<div class="comments"><div class="label">Comments${task.comments&&task.comments.length?` (${task.comments.length})`:""}</div>`;
                    if (task.comments && task.comments.length) {
                        for (const c of task.comments) {
                            viewHtml += `<div class="comment">
                              <span class="comment-author">${escHtml(c.author)}</span>
                              <span class="comment-time">${new Date(c.timestamp).toLocaleString()}</span>
                              <div class="comment-body">${escHtml(c.content)}</div>
                            </div>`;
                        }
                    }
                    // Comment input
                    viewHtml += `<div class="comment-input-area">
                      <textarea id="comment-input" placeholder="Add a comment…"></textarea>
                      <button class="comment-submit" onclick="submitComment('${task.id}')">Post comment</button>
                    </div></div>`;

                    // ── Edit mode HTML ──────────────────────────────────────────
                    const editHtml = `<div class="edit-form" id="edit-form">
                      <div class="ef-row">
                        <label>Title</label>
                        <input id="ef-title" type="text" value="${escHtml(task.title)}">
                      </div>
                      <div class="ef-row">
                        <label>Description</label>
                        <textarea id="ef-description">${escHtml(task.description||"")}</textarea>
                      </div>
                      <div class="ef-row">
                        <label>Priority</label>
                        <select id="ef-priority">
                          ${["urgent","high","normal","low"].map(p=>`<option value="${p}"${task.priority===p?" selected":""}>${p}</option>`).join("")}
                        </select>
                      </div>
                      <div class="ef-row">
                        <label>Tags (comma separated)</label>
                        <input id="ef-tags" type="text" value="${escHtml((task.tags||[]).join(", "))}">
                      </div>
                      <div class="ef-row">
                        <label>Assigned to</label>
                        <input id="ef-assign" type="text" value="${escHtml(task.assigned_to||"")}">
                      </div>
                      <div class="ef-row">
                        <label>Status</label>
                        <select id="ef-status">
                          ${["pending","running","done","blocked"].map(s=>`<option value="${s}"${task.status===s?" selected":""}>${s}</option>`).join("")}
                        </select>
                      </div>
                      <div class="edit-actions">
                        <button class="btn-primary" onclick="saveEdit('${task.id}')">Save changes</button>
                        <button class="btn-secondary" onclick="openModal('${task.id}')">Cancel</button>
                      </div>
                    </div>`;

                    document.getElementById("modal-body").innerHTML = startInEdit ? editHtml : viewHtml;
                    document.getElementById("modal-overlay").classList.add("open");
                } catch (e) {
                    toast("Failed to load task", "error");
                }
            }

            async function submitComment(taskId) {
                const input = document.getElementById("comment-input");
                const content = input ? input.value.trim() : "";
                if (!content) return;
                try {
                    await fetch(`/api/tasks/${taskId}/comment`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ content, author: "user" }),
                    });
                    await openModal(taskId); // Refresh modal
                    toast("Comment added");
                } catch {
                    toast("Failed to post comment", "error");
                }
            }

            async function saveEdit(taskId) {
                const title    = document.getElementById("ef-title")?.value.trim();
                const desc     = document.getElementById("ef-description")?.value.trim();
                const priority = document.getElementById("ef-priority")?.value;
                const tagsRaw  = document.getElementById("ef-tags")?.value ?? "";
                const assign   = document.getElementById("ef-assign")?.value.trim();
                const newStatus = document.getElementById("ef-status")?.value;

                if (!title) { toast("Title cannot be empty", "error"); return; }

                const tags = tagsRaw.split(",").map(t=>t.trim()).filter(Boolean);

                try {
                    // Field update (title, desc, priority, tags, assign)
                    await fetch(`/api/tasks/${taskId}`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            title,
                            description: desc || null,
                            priority,
                            tags,
                            assigned_to: assign || null,
                        }),
                    });

                    // Status change if needed
                    const task = allTasks.find(t => t.id === taskId);
                    if (task && newStatus && newStatus !== task.status) {
                        await fetch(`/api/tasks/${taskId}/status`, {
                            method: "PATCH",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ status: newStatus, output: "Manual update" }),
                        });
                    }

                    await loadTasks(true);
                    await openModal(taskId); // Back to view mode with updated data
                    toast("Task saved");
                } catch {
                    toast("Failed to save task", "error");
                }
            }

            // Edit button wiring
            document.getElementById("modal-edit-btn").addEventListener("click", () => {
                if (currentEditTaskId) openModal(currentEditTaskId, true);
            });

            async function quickAction(taskId, status) {
                try {
                    await fetch(`/api/tasks/${taskId}/status`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ status }),
                    });
                    document.getElementById("modal-overlay").classList.remove("open");
                    await loadTasks();
                    toast(`Task ${status}`);
                } catch {
                    toast("Action failed", "error");
                }
            }

            // ─── New task ─────────────────────────────────────────────────────────────────
            document.getElementById("btn-new").addEventListener("click", () => {
                document
                    .getElementById("new-task-form")
                    .classList.toggle("open");
                if (
                    document
                        .getElementById("new-task-form")
                        .classList.contains("open")
                ) {
                    document.getElementById("nt-title").focus();
                }
            });

            document
                .getElementById("nt-cancel")
                .addEventListener("click", () => {
                    document
                        .getElementById("new-task-form")
                        .classList.remove("open");
                });

            document
                .getElementById("nt-submit")
                .addEventListener("click", async () => {
                    const title = document
                        .getElementById("nt-title")
                        .value.trim();
                    if (!title) {
                        toast("Title is required", "error");
                        return;
                    }

                    const tags = document
                        .getElementById("nt-tags")
                        .value.split(",")
                        .map((t) => t.trim())
                        .filter(Boolean);
                    const assignTo = document
                        .getElementById("nt-assign")
                        .value.trim();

                    try {
                        await fetch("/api/tasks", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                title,
                                priority:
                                    document.getElementById("nt-priority")
                                        .value,
                                tags,
                                assigned_to: assignTo || undefined,
                            }),
                        });
                        document.getElementById("nt-title").value = "";
                        document.getElementById("nt-tags").value = "";
                        document.getElementById("nt-assign").value = "";
                        document
                            .getElementById("new-task-form")
                            .classList.remove("open");
                        await loadTasks();
                        toast("Task created");
                    } catch {
                        toast("Failed to create task", "error");
                    }
                });

            // ─── Filters ─────────────────────────────────────────────────────────────────
            document
                .getElementById("filter-input")
                .addEventListener("input", (e) => {
                    filterText = e.target.value;
                    render();
                });
            document
                .getElementById("filter-priority")
                .addEventListener("change", (e) => {
                    filterPriority = e.target.value;
                    render();
                });
            document
                .getElementById("btn-refresh")
                .addEventListener("click", loadTasks);

            // ─── Modal close ─────────────────────────────────────────────────────────────
            document
                .getElementById("modal-close")
                .addEventListener("click", () => {
                    document
                        .getElementById("modal-overlay")
                        .classList.remove("open");
                });
            document
                .getElementById("modal-overlay")
                .addEventListener("click", (e) => {
                    if (e.target === document.getElementById("modal-overlay")) {
                        document
                            .getElementById("modal-overlay")
                            .classList.remove("open");
                    }
                });
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape")
                    document
                        .getElementById("modal-overlay")
                        .classList.remove("open");
            });

            // ─── SSE ─────────────────────────────────────────────────────────────────────
            function connectSSE() {
                if (sse) {
                    try {
                        sse.close();
                    } catch {}
                }

                sse = new EventSource("/api/events");
                const dot = document.getElementById("live-dot");

                sse.onopen = () => {
                    dot.classList.remove("offline");
                };

                sse.addEventListener("kanban", (e) => {
                    const ev = JSON.parse(e.data);
                    // Reload task list on any change (silent — server is obviously online)
                    loadTasks(true);
                    // Flash card briefly if new task created
                    if (ev.type === "created") {
                        setTimeout(() => {
                            const card = document.querySelector(
                                `.card[data-id="${ev.taskId}"]`,
                            );
                            if (card) card.classList.add("new-flash");
                        }, 200);
                    }
                });

                sse.onerror = () => {
                    dot.classList.add("offline");
                    // Reconnect after 5s
                    setTimeout(connectSSE, 5000);
                };
            }

            // ─── Init ─────────────────────────────────────────────────────────────────────
            (async () => {
                // Initial load — silent so no toast if server isn't up yet
                await loadTasks(true);
                connectSSE();

                // Periodic fallback refresh every 30s (silent)
                setInterval(() => loadTasks(true), 30_000);
            })();
        </script>
    </body>
</html>
